<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0866FF" />
    <title>OneBook · Offline</title>
    <style>
      body {
        margin: 0;
        font-family: system-ui, sans-serif;
        background: #f0f2f5;
        color: #050505;
        display: grid;
        min-height: 100vh;
        place-items: center;
        padding: 24px;
      }
      .card {
        background: #fff;
        border-radius: 12px;
        padding: 24px;
        max-width: 360px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        text-align: center;
      }
      h1 {
        color: #0866ff;
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #65676b;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>OneBook</h1>
      <p>You're offline. Text messages you send will queue and send when internet returns. Photos and videos won't load until you're online.</p>
    </div>
  </body>
</html>
